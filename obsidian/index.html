<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; form-action 'none'; base-uri 'none'"><meta name="description" content="OBSIDIAN 智能座舱 HMI 个人独立概念。虚构数据与模拟控制，不连接真实车辆。"><title>OBSIDIAN · 智能座舱</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="settings.css"><link rel="stylesheet" href="integration.css"></head><body>
<div class="shell"><header><div class="brand"><span class="mark">◇</span> OBSIDIAN <small>智能座舱</small></div><div class="status"><span id="clock">20:48</span><span>18°C</span><span class="battery">▰</span> 82% <span class="online">●</span></div></header>
<main id="view"></main>
<footer><button class="temperature" data-action="quickTemp" data-side="driver"><span>驾驶席</span><b id="driverTemp">22°</b></button><nav id="nav" aria-label="座舱五模块"></nav><button class="temperature" data-action="quickTemp" data-side="passenger"><span>副驾驶</span><b id="passengerTemp">21°</b></button></footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div><dialog id="destinationDialog" aria-labelledby="destination-title"><form id="destinationForm"><div class="dialoghead"><h2 id="destination-title">前往哪里？</h2><button type="button" data-action="closeDialog" aria-label="关闭">×</button></div><label for="destinationInput">搜索目的地</label><input id="destinationInput" placeholder="输入目的地名称" required maxlength="40"><div class="suggestions"><button type="button" data-action="destination" data-value="滨江公园">滨江公园 <small>12.4 km</small></button><button type="button" data-action="destination" data-value="城市美术馆">城市美术馆 <small>8.6 km</small></button><button type="button" data-action="destination" data-value="回家">回家 <small>6.2 km</small></button></div><button class="primary" type="button" data-action="planDestination">规划路线 →</button></form></dialog>
<div class="caption"><span>OBSIDIAN / CONCEPT 01</span><span>为每一段旅途，留一点从容。</span><span>虚构数据演示 · 不控制真实车辆</span></div></div><script src="app.js"></script></body></html>
